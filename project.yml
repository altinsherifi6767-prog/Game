name: DriveGame
options:
  bundleIdPrefix: com.example
targets:
  DriveGame:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: .
        includes: ["*.swift"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.drivegame
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Drive
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        CODE_SIGNING_ALLOWED: NO
